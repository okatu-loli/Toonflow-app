name: Hotfix Windows Build

on:
  push:
    branches:
      - agent/production-agent-hotfix-20260815
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  NODE_VERSION: "24"

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: TypeScript check
        run: yarn lint

      - name: Build Windows x64 installer
        run: yarn dist:win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ToonFlow-1.1.8-hotfix.20260815.1-win-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
